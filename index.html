    <!-- Structured data: FAQ schema for the methodology section -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "@id": "https://buy-vs-rent.example.com/#faq",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "How is the Canadian mortgage payment computed?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Canadian mortgages compound semi-annually under the Interest Act. The effective monthly rate is (1 + r/2)^(1/6) − 1, slightly less than r/12. The monthly payment uses the standard amortization formula: P · r_m · (1 + r_m)^n / ((1 + r_m)^n − 1)."
            }
          },
          {
            "@type": "Question",
            "name": "When is CMHC mortgage insurance required?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "CMHC default insurance is required on Canadian mortgages with less than 20% down. Premiums are 2.8% for 15–19.99% down, 3.1% for 10–14.99%, and 4.0% for 5–9.99%. An additional 0.20% surcharge applies if the amortization exceeds 25 years."
            }
          },
          {
            "@type": "Question",
            "name": "What does \"apply sale costs\" do?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "When on, the buyer's wealth is computed as property value minus sale costs minus mortgage balance, the cash you'd take home if you sold. Turn it off if you plan to keep the property; the buy line then reflects paper equity, which is property value minus mortgage balance."
            }
          },
          {
            "@type": "Question",
            "name": "How does the model handle months when renting costs more than owning?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "The model is symmetric. Each month it sets the cash outlay to max(owning_cost, rent) and the cheaper side invests the difference at the market return. If renting is more expensive, the buyer compounds the surplus into a side portfolio. This keeps the comparison fair when ownership flips from more expensive to less expensive over time."
            }
          },
          {
            "@type": "Question",
            "name": "What is not included in the model?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Included: CMHC insurance, semi-annual compounding, province-aware land transfer tax and FTB rebates, GST/HST on new construction, PST on CMHC where applicable, legal/title/inspection, optional sale costs. Not included: income taxes (TFSA, RRSP, capital gains exemption), refinancing or renewal risk, major one-off repairs beyond monthly maintenance, renter's insurance, moving costs. Constant growth rates. Directional sensitivity tool only, not financial advice."
            }
          }
        ]
      }
    </script>

    <noscript>
      <div style="max-width:720px;margin:48px auto;padding:24px;font-family:-apple-system,BlinkMacSystemFont,Inter,sans-serif;color:#0f172a;line-height:1.6">
        <h1 style="margin:0 0 12px;font-size:28px">Buy vs Rent &amp; Invest</h1>
        <p>
          This calculator compares two long-running decisions: buying a home and either selling or keeping it, or
          renting an equivalent home and investing the difference. The model is a month-by-month simulation of a
          Canadian mortgage with CMHC default insurance, province-aware closing costs, semi-annual compounding,
          optional sale costs, and a symmetric monthly cash-flow assumption.
        </p>
        <p>
          The full calculator requires JavaScript. The source is open under MIT; read the README in the repository
          for the math and a quickstart.
        </p>
      </div>
