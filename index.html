    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "@id": "https://rentorbuy.smmiri.com/#faq",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "How is the Canadian mortgage payment computed?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Quoted rates compound semi-annually. Effective monthly rate: (1 + r/2)^(1/6) − 1. Payment uses standard amortization on principal including CMHC when down payment is below 20%."
            }
          },
          {
            "@type": "Question",
            "name": "Does the renter invest the same money as the buyer at closing?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. The renter is modeled with down payment plus closing costs invested at the market return. The buyer puts the down payment into equity and pays closing costs to third parties."
            }
          },
          {
            "@type": "Question",
            "name": "How are exit taxes handled?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Portfolio gains are taxed annually in a non-registered account. Home sale at the horizon uses the principal residence exemption by default (no tax on the home for a full PR). Marginal rate and inclusion rate are editable."
            }
          },
          {
            "@type": "Question",
            "name": "What does apply sale costs do?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "When on, buyer wealth at exit reflects selling: property value minus realtor and legal costs minus mortgage. When off, wealth is paper equity (property minus mortgage) if you keep the home."
            }
          },
          {
            "@type": "Question",
            "name": "What is not included?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Not modeled: TFSA/FHSA room, RRSP withdrawals, refinancing, rent control, moving costs, or detailed dividend tax. Results are directional, not financial advice."
            }
          }
        ]
      }
    </script>

        <h1 style="margin:0 0 12px;font-size:28px">Rent or Buy? Canadian Buy vs Rent Calculator</h1>
        <p>
          Compare buying a Canadian home (and selling or keeping it at the end of your horizon) with renting a
          similar home and investing the same upfront cash plus monthly surplus when owning costs more.
        </p>
        <p>
          The model includes CMHC insurance, semi-annual mortgage compounding, province-aware closing costs (land
          transfer tax, GST/HST on new builds), optional sale costs at exit, and simplified capital gains tax
          (annual tax on the renter portfolio; principal residence exemption on the home by default).
        </p>
        <p>
          The interactive calculator requires JavaScript. Source code:
