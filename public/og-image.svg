<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      .title { font: 700 64px Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 28px Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #475569; }
      .badge { font: 600 18px Inter, system-ui, sans-serif; fill: #ffffff; }
      .legend { font: 500 22px Inter, system-ui, sans-serif; fill: #475569; }
      .footer { font: 500 18px Inter, system-ui, sans-serif; fill: #64748b; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#f8fafc"/>

  <g transform="translate(80, 80)">
    <rect x="0" y="36" width="36" height="48" rx="6" fill="#2563eb"/>
    <rect x="44" y="12" width="36" height="72" rx="6" fill="#059669"/>
  </g>

  <text class="title" x="80" y="240">Buy vs Rent and Invest</text>
  <text class="subtitle" x="80" y="290">Open-source Canadian mortgage calculator</text>
  <text class="subtitle" x="80" y="328">CMHC - semi-annual compounding - optional sale costs</text>

  <g transform="translate(80, 380)">
    <rect x="0" y="0" width="1040" height="180" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <line x1="40" y1="40" x2="1000" y2="40" stroke="#f1f5f9"/>
    <line x1="40" y1="90" x2="1000" y2="90" stroke="#f1f5f9"/>
    <line x1="40" y1="140" x2="1000" y2="140" stroke="#f1f5f9"/>
    <polyline
      fill="none"
      stroke="#2563eb"
      stroke-width="4"
      points="40,150 140,142 240,128 340,112 440,96 540,82 640,72 740,68 840,72 940,84 1000,98"
    />
    <polyline
      fill="none"
      stroke="#059669"
      stroke-width="4"
      points="40,150 140,140 240,124 340,106 440,86 540,68 640,54 740,46 840,40 940,38 1000,42"
    />
    <circle cx="640" cy="63" r="6" fill="#94a3b8"/>
    <text class="legend" x="660" y="68">Crossover</text>
    <g transform="translate(40, 175)">
      <circle cx="0" cy="0" r="6" fill="#2563eb"/>
      <text class="legend" x="14" y="6">Buy</text>
      <circle cx="120" cy="0" r="6" fill="#059669"/>
      <text class="legend" x="134" y="6">Rent and invest</text>
    </g>
  </g>

  <g transform="translate(80, 100)">
    <rect x="0" y="0" width="170" height="34" rx="17" fill="#0f172a"/>
    <text class="badge" x="22" y="22">MIT - Open source</text>
  </g>

  <text class="footer" x="80" y="600">rentorbuy.smmiri.com</text>
</svg>
